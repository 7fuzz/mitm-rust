name: "publish"

on:
  push:
    tags:
      - 'v*'

jobs:
  publish-native:
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: 'macos-latest'
            target: 'aarch64-apple-darwin'
            binary_name: 'mitm-desktop'
            asset_name: 'mitm-desktop-macos-arm64'
          - platform: 'macos-latest'
            target: 'x86_64-apple-darwin'
            binary_name: 'mitm-desktop'
            asset_name: 'mitm-desktop-macos-x64'
          - platform: 'ubuntu-22.04'
            target: 'x86_64-unknown-linux-gnu'
            binary_name: 'mitm-desktop'
            asset_name: 'mitm-desktop-linux-x64'
          - platform: 'windows-latest'
            target: 'x86_64-pc-windows-msvc'
            binary_name: 'mitm-desktop.exe'
            asset_name: 'mitm-desktop-windows-x64.exe'

    runs-on: ${{ matrix.platform }}
    steps:
      - uses: actions/checkout@v4

      - name: install Rust stable
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: install Linux dependencies
        if: matrix.platform == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y libxcb-render0-dev libxcb-shape0-dev libxcb-xfixes0-dev libxkbcommon-dev libssl-dev

      - name: test
        if: matrix.platform == 'ubuntu-22.04'
        run: cargo test --workspace

      - name: build release binary
        run: cargo build --release --target ${{ matrix.target }} -p mitm-desktop

      # The release profile already strips symbols, so the binary is copied as is.
      - name: package binary and checksum
        shell: bash
        run: |
          cp target/${{ matrix.target }}/release/${{ matrix.binary_name }} ${{ matrix.asset_name }}
          if command -v sha256sum >/dev/null; then
            sha256sum ${{ matrix.asset_name }} > ${{ matrix.asset_name }}.sha256
          else
            shasum -a 256 ${{ matrix.asset_name }} > ${{ matrix.asset_name }}.sha256
          fi
          cat ${{ matrix.asset_name }}.sha256

      - name: upload release assets
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/')
        with:
          files: |
            ${{ matrix.asset_name }}
            ${{ matrix.asset_name }}.sha256
          draft: true
