[package]
name = "mitm-rust"
version = "0.2.0"
description = "A Tauri App"
authors = ["you"]
edition = "2021"

[lib]
name = "mitm_rust_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-opener = "2"
tauri-plugin-sql = "2"
tauri-plugin-dialog = "2"
tauri-plugin-fs = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
time = "0.3"
rusqlite = { version = "0.31", features = ["bundled"] }
rcgen = { version = "0.13", features = ["pem", "x509-parser"] }
tokio = { version = "1", features = ["full"] }
hyper = { version = "1", features = ["full"] }
hyper-util = { version = "0.1", features = ["full"] }
tokio-rustls = "0.26"
rustls = { version = "0.23", features = ["ring"] }
rustls-pki-types = "1"
uuid = { version = "1", features = ["v4", "v7", "serde"] }
http-body-util = "0.1"
hyper-rustls = { version = "0.27", features = ["http1", "tls12", "ring", "webpki-roots"] }
bytes = "1"
flate2 = "1.0"
brotli = "7.0"
zstd = "0.13"
base64 = "0.22"
reqwest = { version = "0.12", features = ["json", "rustls-tls", "gzip", "brotli", "deflate", "zstd", "multipart"] }
ring = "0.17"
dashmap = "6"
regex = "1"
chrono = { version = "0.4", features = ["serde"] }
url = "2"
tokio-tungstenite = { version = "0.24", features = ["rustls-tls-webpki-roots", "connect", "handshake"] }
tungstenite = "0.24"
futures-util = { version = "0.3", default-features = false, features = ["sink", "std", "async-await"] }
hex = "0.4"


