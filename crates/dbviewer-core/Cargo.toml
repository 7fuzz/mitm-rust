[package]
name = "dbviewer-core"
version = "0.1.0"
edition = "2021"

[dependencies]
anyhow = "1"
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["preserve_order"] }
tokio = { version = "1", features = ["full"] }
tokio-postgres = "0.7"
mysql_async = { version = "0.36", default-features = false, features = ["minimal"] }
