[package]
name = "mitm-desktop"
version = "0.2.1"
edition = "2021"

[dependencies]
mitm-core = { path = "../mitm-core" }

eframe = "0.36.2"
egui = "0.36.2"
egui_dock = "0.21.1"
egui_extras = { version = "0.36.2", features = ["default"] }

tokio = { version = "1", features = ["full"] }
crossbeam-channel = "0.5"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
chrono = "0.4"
uuid = { version = "1", features = ["v4"] }
