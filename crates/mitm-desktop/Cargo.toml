[package]
name = "mitm-desktop"
version = "0.2.1"
edition = "2021"

[dependencies]
mitm-core = { path = "../mitm-core" }

eframe = { version = "0.36.2", features = ["persistence"] }
egui = "0.36.2"
egui_dock = { version = "0.21.1", features = ["serde"] }
egui_extras = { version = "0.36.2", features = ["default", "image", "svg"] }
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "gif", "webp"] }

tokio = { version = "1", features = ["full"] }
crossbeam-channel = "0.5"
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["preserve_order"] }
chrono = "0.4"
base64 = "0.22"
uuid = { version = "1", features = ["v4"] }
rfd = "0.17"
open = "5"
http = "1"
similar = "2"
arboard = { version = "3", default-features = false, features = ["wayland-data-control", "image-data"] }
rqrr = { version = "0.10", default-features = false }
zeroize = "1"
egui_commonmark = { version = "0.25", default-features = false, features = ["pulldown_cmark"] }

[dev-dependencies]
qrcode = { version = "0.14", default-features = false }
