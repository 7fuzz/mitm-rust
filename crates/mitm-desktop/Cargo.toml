[package]
name = "mitm-desktop"
version = "0.2.1"
edition = "2021"

[dependencies]
mitm-core = { path = "../mitm-core" }

eframe = { version = "0.36.2", features = ["persistence"] }
egui = "0.36.2"
egui_dock = { version = "0.21.1", features = ["serde"] }
egui_extras = { version = "0.36.2", features = ["default"] }

tokio = { version = "1", features = ["full"] }
crossbeam-channel = "0.5"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
chrono = "0.4"
base64 = "0.22"
uuid = { version = "1", features = ["v4"] }
